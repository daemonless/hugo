icon: ":simple-hugo:"
cit:
  mode: health
  port: 1313
  health: /
build:
  pkg_name: gohugo
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"
